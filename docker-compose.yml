version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: al_mokhtabar_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: al_mokhtabar
      POSTGRES_USER: al_mokhtabar
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_2024}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U al_mokhtabar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - al_mokhtabar_net

  redis:
    image: redis:7-alpine
    container_name: al_mokhtabar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_2024} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - al_mokhtabar_net

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: al_mokhtabar_search
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key_2024}
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - al_mokhtabar_net

  minio:
    image: minio/minio
    container_name: al_mokhtabar_storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin2024}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - al_mokhtabar_net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: al_mokhtabar_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://al_mokhtabar:${DB_PASSWORD:-secure_password_2024}@postgres:5432/al_mokhtabar
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_2024}@redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key_2024}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin2024}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - al_mokhtabar_net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: al_mokhtabar_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:3001/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - al_mokhtabar_net

  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile
    container_name: al_mokhtabar_ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      - al_mokhtabar_net

  nginx:
    image: nginx:alpine
    container_name: al_mokhtabar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
      - backend
    networks:
      - al_mokhtabar_net

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:

networks:
  al_mokhtabar_net:
    driver: bridge
