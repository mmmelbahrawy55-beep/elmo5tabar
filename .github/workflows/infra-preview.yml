name: Infrastructure Preview

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'infrastructure/kubernetes/**'
      - 'infrastructure/scripts/**'
    branches: [main, develop]
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - 'infrastructure/kubernetes/**'
      - 'infrastructure/scripts/**'

env:
  TF_ROOT: infrastructure/terraform
  TF_VERSION: 1.7.0

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_ROOT }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Initialize
        run: terraform init -backend=false
        working-directory: ${{ env.TF_ROOT }}
      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_ROOT }}

  terraform-plan:
    name: Terraform Plan
    needs: [terraform-format, terraform-validate]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    strategy:
      matrix:
        environment: [production, staging]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', matrix.environment)] }}
          aws-region: us-east-1
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=almokhtabar-tfstate-${{ matrix.environment }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=../../global.tfvars \
            -var="environment=${{ matrix.environment }}" \
            -out=tfplan-${{ matrix.environment }}
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}/tfplan-${{ matrix.environment }}
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.TF_ROOT }}/environments/${{ matrix.environment }}/tfplan-${{ matrix.environment }}.txt', 'utf8');
            const output = `### Terraform Plan: \`${{ matrix.environment }}\`
            \`\`\`diff
            ${planOutput.substring(0, 60000)}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        environment: [production, staging]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', matrix.environment)] }}
          aws-region: us-east-1
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=almokhtabar-tfstate-${{ matrix.environment }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-${{ matrix.environment }}
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}

  kubernetes-manifest-lint:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: |
          find infrastructure/kubernetes -name '*.yaml' -o -name '*.yml' | while read -r f; do
            kubeconform -strict -summary "$f"
          done
      - name: Helm chart lint
        run: |
          helm lint infrastructure/kubernetes/helm/almokhtabar
