name: Scheduled Security Scan

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Run Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infrastructure/
          format: sarif
          output: trivy-config-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-iac

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.language == 'javascript'
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: '3.11'
      - name: npm audit
        if: matrix.language == 'javascript'
        run: |
          npm ci
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
      - name: pip audit
        if: matrix.language == 'python'
        run: |
          pip install pip-audit
          pip install -r packages/ai-service/requirements.txt
          pip-audit --json > pip-audit-report.json || true
      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.language }}
          path: |
            *-audit-report.json
            !node_modules/

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified --results=verified-secrets.json
      - name: GitLeaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload secret scan results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: verified-secrets.json

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images for scanning
        run: |
          docker build -t almokhtabar-backend:scan -f docker/Dockerfile.backend .
          docker build -t almokhtabar-web:scan -f docker/Dockerfile.web .
          docker build -t almokhtabar-ai:scan -f docker/Dockerfile.ai-service .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: almokhtabar-backend:scan
          format: sarif
          output: trivy-image-backend.sarif
          severity: CRITICAL,HIGH
      - name: Scan web image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: almokhtabar-web:scan
          format: sarif
          output: trivy-image-web.sarif
          severity: CRITICAL,HIGH
      - name: Scan AI image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: almokhtabar-ai:scan
          format: sarif
          output: trivy-image-ai.sarif
          severity: CRITICAL,HIGH
      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-backend.sarif
      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-web.sarif
      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-ai.sarif

  report:
    name: Generate Security Report
    needs: [vulnerability-scan, dependency-scan, secret-scanning, container-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Summarize findings
        run: |
          echo "## Security Scan Summary - $(date -u)" > security-report.md
          echo "" >> security-report.md
          echo "### Scan Results" >> security-report.md
          echo "| Scan Type | Status |" >> security-report.md
          echo "|-----------|--------|" >> security-report.md
          echo "| Vulnerability Scan (Trivy) | ✅ Completed |" >> security-report.md
          echo "| IaC Scan (Trivy Config) | ✅ Completed |" >> security-report.md
          echo "| Dependency Scan (JS) | ✅ Completed |" >> security-report.md
          echo "| Dependency Scan (Python) | ✅ Completed |" >> security-report.md
          echo "| Secret Scanning | ✅ Completed |" >> security-report.md
          echo "| Container Image Scan | ✅ Completed |" >> security-report.md
          echo "" >> security-report.md
          echo "Generated: $(date -u)" >> security-report.md
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
      - name: Notify security team
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🔒 Weekly security scan completed for almokhtabar",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Weekly Security Scan Complete*\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK }}
