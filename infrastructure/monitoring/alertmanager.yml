global:
  resolve_timeout: 5m
  smtp_smarthost: email-smtp.us-east-1.amazonaws.com:587
  smtp_from: alerts@almokhtabar.com
  smtp_auth_username: ${SMTP_USERNAME}
  smtp_auth_password: ${SMTP_PASSWORD}
  smtp_require_tls: true
  pagerduty_url: https://events.pagerduty.com/v2/enqueue
  slack_api_url: ${SLACK_WEBHOOK_URL}
  opsgenie_api_url: https://api.opsgenie.com/v2/alerts
  opsgenie_api_key: ${OPSGENIE_API_KEY}

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: default
  group_by:
    - alertname
    - cluster
    - severity
    - team
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      repeat_interval: 1h
      continue: true
    - match:
        severity: critical
      receiver: slack-critical
      continue: false
    - match:
        severity: warning
      receiver: slack-warning
      repeat_interval: 4h
    - match:
        severity: info
      receiver: email-info
      repeat_interval: 8h
    - match:
        team: security
      receiver: pagerduty-security
      repeat_interval: 30m
    - match:
        alertname: DiskSpaceLow
      receiver: slack-platform
      repeat_interval: 2h
    - match_re:
        severity: critical
        team: platform
      receiver: opsgenie-platform
      continue: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname
      - cluster
  - source_match:
      alertname: HighCPUUsage
    target_match:
      alertname: PodPending
    equal:
      - node
  - source_match:
      alertname: MaintenanceWindow
    target_match_re:
      severity: "warning|info"
    equal:
      - cluster

receivers:
  - name: default
    slack_configs:
      - channel: "#alerts"
        title: '{{ template "default_title" . }}'
        text: '{{ template "default_message" . }}'
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - channel: "#critical"
        title: '{{ template "critical_title" . }}'
        text: '{{ template "critical_message" . }}'
        send_resolved: true
        color: danger
        actions:
          - type: button
            text: "View in Prometheus"
            url: 'https://prometheus.almokhtabar.com/alertmanager/{{ .GroupLabels.alertname }}'
          - type: button
            text: "Runbook"
            url: 'https://wiki.almokhtabar.com/runbooks/{{ .GroupLabels.alertname }}'

  - name: slack-warning
    slack_configs:
      - channel: "#alerts"
        title: '{{ template "warning_title" . }}'
        text: '{{ template "warning_message" . }}'
        send_resolved: true
        color: warning

  - name: slack-platform
    slack_configs:
      - channel: "#platform"
        text: '{{ template "platform_message" . }}'
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: critical
        images:
          - src: https://almokhtabar.com/icon-alert.png
            alt: Almokhtabar Alert
        links:
          - href: 'https://grafana.almokhtabar.com/d/overview'
            text: "Grafana Dashboard"
        client: "Al Mokhtabar Monitoring"
        client_url: "https://monitoring.almokhtabar.com"
        description: '{{ template "pagerduty_description" . }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          runbook: 'https://wiki.almokhtabar.com/runbooks'
        send_resolved: true

  - name: pagerduty-security
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_SECURITY_KEY}
        severity: critical
        description: '{{ template "pagerduty_security_description" . }}'
        links:
          - href: 'https://grafana.almokhtabar.com/d/security'
            text: "Security Dashboard"
        send_resolved: true

  - name: opsgenie-platform
    opsgenie_configs:
      - api_key: ${OPSGENIE_API_KEY}
        priority: P1
        tags:
          - almokhtabar
          - infrastructure
          - critical
        responders:
          - name: "Platform Team"
            type: team
        visible_to:
          - name: "Engineering"
            type: team
        note: '{{ template "opsgenie_note" . }}'
        send_resolved: true

  - name: email-info
    email_configs:
      - to: "engineering@almokhtabar.com"
        from: "alerts@almokhtabar.com"
        html: '{{ template "email.html" . }}'
        headers:
          Subject: "[Al Mokhtabar] {{ .GroupLabels.alertname }} - {{ .Status }}"
        send_resolved: true
