[server]
protocol = https
domain = grafana.almokhtabar.com
root_url = https://grafana.almokhtabar.com
http_port = 3000
enable_gzip = true
cert_file = /etc/grafana/certs/tls.crt
cert_key = /etc/grafana/certs/tls.key

[security]
admin_user = ${GRAFANA_ADMIN_USER}
admin_password = ${GRAFANA_ADMIN_PASSWORD}
secret_key = ${GRAFANA_SECRET_KEY}
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
content_security_policy = true
content_security_policy_template = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: *.grafana.net *.grafana.com; object-src 'none'; font-src 'self'; connect-src 'self' grafana.almokhtabar.com https://*.amazonaws.com https://api.opsgenie.com; frame-src 'self'"

[auth]
signout_redirect_url = https://almokhtabar.com
oauth_allow_insecure_email_lookup = true
disable_login_form = false
disable_signout_menu = false

[auth.google]
enabled = true
client_id = ${GOOGLE_CLIENT_ID}
client_secret = ${GOOGLE_CLIENT_SECRET}
scopes = openid email profile
auth_url = https://accounts.google.com/o/oauth2/v2/auth
token_url = https://oauth2.googleapis.com/token
allowed_domains = almokhtabar.com
allow_sign_up = true
role_attribute_path = contains(email, '@admin.almokhtabar.com') && 'Admin' || 'Editor'

[auth.github]
enabled = true
client_id = ${GITHUB_CLIENT_ID}
client_secret = ${GITHUB_CLIENT_SECRET}
scopes = user:email,read:org
team_ids =
allowed_organizations = almokhtabar
role_attribute_path = contains(login, '@admin') && 'Admin' || 'Editor'

[auth.saml]
enabled = true
certificate_path = /etc/grafana/saml/saml.crt
private_key_path = /etc/grafana/saml/saml.key
idp_metadata_url = https://idp.almokhtabar.com/metadata
max_issue_delay = 90s
metadata_valid_duration = 48h
relay_state = https://grafana.almokhtabar.com/login/saml

[server.settings]
allow_embedding = false

[data_proxy]
logging = true
timeout = 30

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[unified_alerting]
enabled = true
execute_alerts = true
evaluation_timeout = 30s
max_attempts = 3
min_interval = 10s
ha_peers = 3
ha_listen_address = "0.0.0.0:9094"
ha_advertise_address = "${POD_IP}:9094"

[alerting]
enabled = false
execute_alerts = false

[explore]
enabled = true

[dashboards]
versions_to_keep = 20
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/almokhtabar-overview.json

[links]
# Global links for top menu

[smtp]
enabled = true
host = email-smtp.us-east-1.amazonaws.com:587
user = ${SMTP_USER}
password = ${SMTP_PASSWORD}
cert_file =
key_file =
skip_verify = false
from_address = noreply@almokhtabar.com
from_name = "Al Mokhtabar Grafana"
ehlo_identity = almokhtabar.com
startTLS_policy = MandatoryStartTLS

[emails]
welcome_email_enabled = true

[log]
mode = console file
level = info
filters = alerting:debug

[log.console]
format = json

[log.file]
format = json
max_lines = 1000000
max_files = 5
daily_rotate = true

[grafana_com]
url = https://grafana.com

[metrics]
enabled = true
interval_seconds = 10
basic_auth_username = ${METRICS_USER}
basic_auth_password = ${METRICS_PASSWORD}

[metrics.graphite]
enabled = false

[snapshots]
enabled = false

[external_image_storage]
provider = s3
[external_image_storage.s3]
bucket = almokhtabar-grafana-images
region = us-east-1
access_key = ${AWS_ACCESS_KEY_ID}
secret_key = ${AWS_SECRET_ACCESS_KEY}

[rendering]
server_url = http://renderer:8081/render
callback_url = http://grafana:3000/

[enterprise]
license_path = /etc/grafana/license/license.jwt

[feature_toggles]
enable = alertingBacktesting livePipeline

[reporting]
enabled = true
rendering_timeout = 60s
max_retries = 5
