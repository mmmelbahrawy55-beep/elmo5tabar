global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: almokhtabar-production
    environment: production
    region: us-east-1

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 5s
      api_version: v2

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "kubernetes"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels:
          [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels:
          [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  - job_name: "kubernetes-nodes"
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - replacement: kubernetes.default.svc:443
        target_label: __address__
      - regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics
        source_labels:
          - __meta_kubernetes_node_name
        target_label: __metrics_path__

  - job_name: "kubernetes-cadvisor"
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - replacement: kubernetes.default.svc:443
        target_label: __address__
      - regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        source_labels:
          - __meta_kubernetes_node_name
        target_label: __metrics_path__

  - job_name: "backend"
    static_configs:
      - targets:
          - backend-service:3001
        labels:
          app: backend
          service: api

  - job_name: "postgres"
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          app: postgres
          service: database

  - job_name: "redis"
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          app: redis
          service: cache

  - job_name: "node"
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          app: node-exporter
          service: infra

  - job_name: "nginx"
    static_configs:
      - targets:
          - nginx-exporter:9113
        labels:
          app: nginx
          service: ingress

  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://almokhtabar.com
          - https://almokhtabar.com/api/v1/health
          - https://almokhtabar.com/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "kube-state-metrics"
    static_configs:
      - targets:
          - kube-state-metrics:8080
        labels:
          app: kube-state-metrics
          service: k8s

  - job_name: "kubelet"
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: false
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - replacement: kubernetes.default.svc:443
        target_label: __address__
      - regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics
        source_labels:
          - __meta_kubernetes_node_name
        target_label: __metrics_path__

remote_write:
  - url: https://prometheus-prod-endpoint.almokhtabar.com/api/v1/write
    basic_auth:
      username: ${PROM_USERNAME}
      password: ${PROM_PASSWORD}
    write_relabel_configs:
      - source_labels: [__name__]
        regex: ".*"
        action: keep
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500
