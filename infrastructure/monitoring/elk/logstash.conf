input {
  beats {
    port => 5044
    ssl => true
    ssl_certificate => "/etc/logstash/certs/logstash.crt"
    ssl_key => "/etc/logstash/certs/logstash.key"
    ssl_verify_mode => "force_peer"
    ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    client_inactivity_timeout => 60
  }

  tcp {
    port => 5000
    type => "syslog"
    codec => json_lines
  }

  http {
    port => 8080
    codec => json
    user => "${LOGSTASH_HTTP_USER}"
    password => "${LOGSTASH_HTTP_PASSWORD}"
  }
}

filter {
  if [log_type] == "api" or [fields][log_type] == "api" {
    grok {
      match => {
        "message" => [
          '%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}\s+%{DATA:request_id}\s+%{DATA:method}\s+%{URIPATHPARAM:path}\s+%{DATA:query_string}\s+%{INT:status_code}\s+%{INT:response_time_ms}\s+%{DATA:user_agent}',
          '%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}\s+%{DATA:logger}\s+%{GREEDYDATA:message}'
        ]
      }
      break_on_match => true
      tag_on_failure => ["_grok_failure_api"]
    }

    if "_grok_failure_api" not in [tags] {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }

      useragent {
        source => "user_agent"
        target => "ua"
      }

      mutate {
        convert => { "response_time_ms" => "integer" }
        convert => { "status_code" => "integer" }
        rename => { "response_time_ms" => "response_time" }
        remove_field => ["timestamp", "user_agent"]
      }
    }
  }

  else if [log_type] == "nginx" or [fields][log_type] == "nginx" {
    grok {
      match => {
        "message" => [
          '%{IPORHOST:client_ip}\s+-\s+%{DATA:ident}\s+\[%{HTTPDATE:timestamp}\]\s+"%{DATA:method}\s+%{URIPATHPARAM:request}\s+%{DATA:http_version}"\s+%{INT:status_code}\s+%{INT:body_bytes_sent}\s+"%{DATA:referrer}"\s+"%{DATA:user_agent}"\s+%{NUMBER:request_time:float}\s+%{NUMBER:upstream_time:float}',
          '%{IPORHOST:client_ip}\s+-\s+%{DATA:ident}\s+\[%{HTTPDATE:timestamp}\]\s+"%{DATA:method}\s+%{URIPATHPARAM:request}\s+%{DATA:http_version}"\s+%{INT:status_code}\s+%{INT:body_bytes_sent}\s+"%{DATA:referrer}"\s+"%{DATA:user_agent}"'
        ]
      }
      break_on_match => true
      tag_on_failure => ["_grok_failure_nginx"]
    }

    if "_grok_failure_nginx" not in [tags] {
      date {
        match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
      }

      useragent {
        source => "user_agent"
        target => "ua"
      }

      geoip {
        source => "client_ip"
        target => "geo"
        database => "/etc/logstash/GeoLite2-City.mmdb"
        add_field => ["[geo][coordinates]", "%{[geo][longitude]}"]
        add_field => ["[geo][coordinates]", "%{[geo][latitude]}"]
      }

      mutate {
        convert => { "[geo][coordinates]" => "float" }
        convert => { "body_bytes_sent" => "integer" }
        convert => { "request_time" => "float" }
        convert => { "upstream_time" => "float" }
        convert => { "status_code" => "integer" }
        remove_field => ["timestamp", "ident", "http_version"]
      }
    }
  }

  else if [log_type] == "system" or [fields][log_type] == "system" {
    grok {
      match => {
        "message" => [
          '%{SYSLOGTIMESTAMP:syslog_timestamp}\s+%{SYSLOGHOST:hostname}\s+%{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:syslog_message}',
          '%{TIMESTAMP_ISO8601:timestamp}\s+%{SYSLOGHOST:hostname}\s+%{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:syslog_message}'
        ]
      }
      tag_on_failure => ["_grok_failure_system"]
    }

    if "_grok_failure_system" not in [tags] {
      date {
        match => ["timestamp", "ISO8601", "MMM dd HH:mm:ss"]
        target => "@timestamp"
      }
    }
  }

  else if [log_type] == "json" or [fields][log_type] == "json" {
    json {
      source => "message"
      target => "json"
      tag_on_failure => ["_json_failure"]
    }

    if "_json_failure" not in [tags] {
      mutate {
        remove_field => ["message"]
        rename => ["json", "message"]
      }
    }
  }

  else {
    json {
      source => "message"
      target => "json"
      add_field => { "parsed_as" => "json_fallback" }
      tag_on_failure => ["_json_parse_failure"]
    }

    if "_json_parse_failure" in [tags] {
      mutate {
        remove_tag => ["_json_parse_failure"]
        add_tag => ["plaintext"]
      }
    }
  }

  if [ua] {
    mutate {
      rename => { "[ua][name]" => "browser_name" }
      rename => { "[ua][os_name]" => "os_name" }
      rename => { "[ua][device]" => "device_type" }
    }
  }

  mutate {
    add_tag => ["almokhtabar", "production"]
    add_field => {
      "environment" => "production"
      "project" => "almokhtabar"
      "[@metadata][index_date]" => "%{+YYYY.MM.dd}"
    }
    remove_field => ["@version", "path", "host", "ecs"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "almokhtabar-%{[fields][log_type]}-%{[@metadata][index_date]}"
    template => "/etc/logstash/templates/almokhtabar-template.json"
    template_name => "almokhtabar"
    template_overwrite => true
    manage_template => true
    ilm_enabled => true
    ilm_rollover_alias => "almokhtabar"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "almokhtabar-ilm-policy"
    ssl => true
    cacert => "/etc/logstash/certs/ca.crt"
    timeout => 30
    bulk_path => "/_bulk"
    sniffing => false
    action => "index"
  }

  stdout {
    codec => rubydebug {
      metadata => false
      exception => false
      suppressed => []
    }
  }
}
