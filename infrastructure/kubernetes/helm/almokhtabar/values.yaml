global:
  environment: production
  imageRegistry: ""
  imagePullSecrets: []
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

backend:
  name: backend
  replicaCount: 3
  image:
    repository: almokhtabar/backend
    tag: latest
    pullPolicy: Always
  port: 3001
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  terminationGracePeriodSeconds: 60
  probe:
    readiness:
      path: /api/v1/health
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      path: /api/v1/health
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  config:
    logLevel: info
    corsOrigins: https://almokhtabar.com
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend

web:
  name: web
  replicaCount: 3
  image:
    repository: almokhtabar/web
    tag: latest
    pullPolicy: Always
  port: 3000
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  terminationGracePeriodSeconds: 60
  probe:
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      path: /
      initialDelaySeconds: 20
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
  config:
    nextPublicApiUrl: https://api.almokhtabar.com
    nextPublicWsUrl: wss://api.almokhtabar.com
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: web

aiService:
  name: ai-service
  replicaCount: 2
  image:
    repository: almokhtabar/ai-service
    tag: latest
    pullPolicy: Always
  port: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 4
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 60
  probe:
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
  gpu:
    enabled: false
    nodeSelector:
      nvidia.com/gpu: present
  config:
    modelPath: /models
    batchSize: 32
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: ai-service

postgresql:
  internal: false
  external:
    host: ""
    port: 5432
    database: almokhtabar
    user: almokhtabar
  postgresql-ha:
    postgresql:
      replicaCount: 2
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi

redis:
  internal: false
  external:
    host: ""
    port: 6379
    password: ""

meilisearch:
  name: meilisearch
  replicaCount: 1
  image:
    repository: getmeili/meilisearch
    tag: v1.8
    pullPolicy: IfNotPresent
  port: 7700
  service:
    type: ClusterIP
    port: 7700
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ssd
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origins: "https://almokhtabar.com"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffer-size: 8k
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst: "200"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
  hosts:
    - host: almokhtabar.com
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          service: backend
          port: 3001
        - path: /socket.io(/|$)(.*)
          pathType: ImplementationSpecific
          service: backend
          port: 3001
        - path: /
          pathType: Prefix
          service: web
          port: 3000
    - host: api.almokhtabar.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
          port: 3001
    - host: ai.almokhtabar.com
      paths:
        - path: /
          pathType: Prefix
          service: ai-service
          port: 8000
  tls:
    - secretName: almokhtabar-tls
      hosts:
        - almokhtabar.com
        - "*.almokhtabar.com"

monitoring:
  enabled: true
  prometheus:
    metrics: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "3001"

secrets:
  db:
    password: ""
    url: ""
  redis:
    password: ""
  jwt:
    secret: ""
    refreshSecret: ""
  meilisearch:
    masterKey: ""
  encryption:
    key: ""
  smtp:
    host: ""
    port: 587
    user: ""
    password: ""
    from: ""
  oauth:
    google:
      clientId: ""
      clientSecret: ""
    facebook:
      clientId: ""
      clientSecret: ""
  payment:
    stripe:
      secretKey: ""
      webhookSecret: ""
    tap:
      secretKey: ""
    hyperpay:
      entityId: ""
      accessToken: ""
  ai:
    openaiKey: ""
    anthropicKey: ""
  monitoring:
    datadogApiKey: ""
    sentryDsn: ""

configmap:
  apiUrl: https://api.almokhtabar.com
  frontendUrl: https://almokhtabar.com
  logLevel: info
  corsOrigins: https://almokhtabar.com,https://admin.almokhtabar.com
  nodeEnv: production
  featureFlags: |
    ENABLE_AI_DIAGNOSTICS=true
    ENABLE_TELEMEDICINE=true
    ENABLE_OCR=true
    ENABLE_PUSH_NOTIFICATIONS=true
    MAINTENANCE_MODE=false
  monitoring:
    sentryEnvironment: production
    datadogEnabled: "true"

namespace:
  name: almokhtabar

serviceAccount:
  create: true
  name: almokhtabar
  annotations:
    eks.amazonaws.com/role-arn: ""
    iam.gke.io/gcp-service-account: ""
    azure.workload.identity/client-id: ""

networkPolicy:
  enabled: true
  ingressController:
    namespace: ingress-nginx
    podSelector:
      app.kubernetes.io/component: controller
  monitoringNamespace: monitoring

persistence:
  uploads:
    enabled: true
    size: 10Gi
    storageClassName: ssd
    accessMode: ReadWriteOnce
  logs:
    enabled: true
    size: 5Gi
    storageClassName: ssd
    accessMode: ReadWriteOnce
