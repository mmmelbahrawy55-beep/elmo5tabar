apiVersion: v1
kind: Service
metadata:
  name: {{ include "almokhtabar.fullname" . }}-web
  namespace: {{ .Values.namespace.name | default "almokhtabar" }}
  labels:
    {{- include "almokhtabar.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "almokhtabar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
