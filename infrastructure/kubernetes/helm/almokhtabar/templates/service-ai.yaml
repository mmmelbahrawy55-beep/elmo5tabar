apiVersion: v1
kind: Service
metadata:
  name: {{ include "almokhtabar.fullname" . }}-ai-service
  namespace: {{ .Values.namespace.name | default "almokhtabar" }}
  labels:
    {{- include "almokhtabar.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
  annotations:
    {{- if .Values.monitoring.enabled }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.aiService.service.port }}"
    prometheus.io/path: "/metrics"
    {{- end }}
spec:
  type: {{ .Values.aiService.service.type }}
  ports:
    - port: {{ .Values.aiService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "almokhtabar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
