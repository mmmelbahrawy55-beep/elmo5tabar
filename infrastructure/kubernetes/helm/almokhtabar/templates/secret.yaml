apiVersion: v1
kind: Secret
metadata:
  name: {{ include "almokhtabar.fullname" . }}-secrets
  namespace: {{ .Values.namespace.name | default "almokhtabar" }}
  labels:
    {{- include "almokhtabar.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.db.password | quote }}
  DATABASE_URL: {{ .Values.secrets.db.url | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | quote }}
  JWT_SECRET: {{ .Values.secrets.jwt.secret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwt.refreshSecret | quote }}
  MEILI_MASTER_KEY: {{ .Values.secrets.meilisearch.masterKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryption.key | quote }}
  SMTP_HOST: {{ .Values.secrets.smtp.host | quote }}
  SMTP_PORT: {{ .Values.secrets.smtp.port | quote }}
  SMTP_USER: {{ .Values.secrets.smtp.user | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtp.password | quote }}
  SMTP_FROM: {{ .Values.secrets.smtp.from | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.oauth.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.oauth.google.clientSecret | quote }}
  FACEBOOK_CLIENT_ID: {{ .Values.secrets.oauth.facebook.clientId | quote }}
  FACEBOOK_CLIENT_SECRET: {{ .Values.secrets.oauth.facebook.clientSecret | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.payment.stripe.secretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.payment.stripe.webhookSecret | quote }}
  TAP_SECRET_KEY: {{ .Values.secrets.payment.tap.secretKey | quote }}
  HYPERPAY_ENTITY_ID: {{ .Values.secrets.payment.hyperpay.entityId | quote }}
  HYPERPAY_ACCESS_TOKEN: {{ .Values.secrets.payment.hyperpay.accessToken | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.ai.openaiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ai.anthropicKey | quote }}
  DD_API_KEY: {{ .Values.secrets.monitoring.datadogApiKey | quote }}
  SENTRY_DSN: {{ .Values.secrets.monitoring.sentryDsn | quote }}
