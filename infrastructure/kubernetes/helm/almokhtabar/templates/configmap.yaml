apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "almokhtabar.fullname" . }}-config
  namespace: {{ .Values.namespace.name | default "almokhtabar" }}
  labels:
    {{- include "almokhtabar.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.configmap.nodeEnv | quote }}
  API_URL: {{ .Values.configmap.apiUrl | quote }}
  FRONTEND_URL: {{ .Values.configmap.frontendUrl | quote }}
  LOG_LEVEL: {{ .Values.configmap.logLevel | quote }}
  CORS_ORIGINS: {{ .Values.configmap.corsOrigins | quote }}
  ENABLE_AI_DIAGNOSTICS: {{ .Values.configmap.featureFlags | regexFind "ENABLE_AI_DIAGNOSTICS=[^\\n]+" | default "true" }}
  ENABLE_TELEMEDICINE: {{ .Values.configmap.featureFlags | regexFind "ENABLE_TELEMEDICINE=[^\\n]+" | default "true" }}
  ENABLE_PUSH_NOTIFICATIONS: {{ .Values.configmap.featureFlags | regexFind "ENABLE_PUSH_NOTIFICATIONS=[^\\n]+" | default "true" }}
  MAINTENANCE_MODE: {{ .Values.configmap.featureFlags | regexFind "MAINTENANCE_MODE=[^\\n]+" | default "false" }}
  SENTRY_ENVIRONMENT: {{ .Values.configmap.monitoring.sentryEnvironment | quote }}
  DD_ENABLED: {{ .Values.configmap.monitoring.datadogEnabled | quote }}
  APP_NAME: {{ include "almokhtabar.name" . | quote }}
  APP_ENV: {{ .Values.global.environment | quote }}
{{- if .Values.backend.config }}
  BACKEND_LOG_LEVEL: {{ .Values.backend.config.logLevel | quote }}
  BACKEND_CORS_ORIGINS: {{ .Values.backend.config.corsOrigins | quote }}
{{- end }}
{{- if .Values.web.config }}
  NEXT_PUBLIC_API_URL: {{ .Values.web.config.nextPublicApiUrl | quote }}
  NEXT_PUBLIC_WS_URL: {{ .Values.web.config.nextPublicWsUrl | quote }}
{{- end }}
{{- if .Values.aiService.config }}
  AI_MODEL_PATH: {{ .Values.aiService.config.modelPath | quote }}
  AI_BATCH_SIZE: {{ .Values.aiService.config.batchSize | quote }}
{{- end }}
{{- if .Values.postgresql.external.host }}
  DB_HOST: {{ .Values.postgresql.external.host | quote }}
  DB_PORT: {{ .Values.postgresql.external.port | quote }}
  DB_NAME: {{ .Values.postgresql.external.database | quote }}
  DB_USER: {{ .Values.postgresql.external.user | quote }}
{{- end }}
{{- if .Values.redis.external.host }}
  REDIS_HOST: {{ .Values.redis.external.host | quote }}
  REDIS_PORT: {{ .Values.redis.external.port | quote }}
{{- end }}
  MEILISEARCH_URL: http://{{ include "almokhtabar.fullname" . }}-meilisearch:{{ .Values.meilisearch.service.port }}
