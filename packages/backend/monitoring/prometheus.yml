global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'almokhtabar-api'
    static_configs:
      - targets: ['app:3001']
    metrics_path: '/api/v1/metrics'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
