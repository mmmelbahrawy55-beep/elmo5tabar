services:
  - type: web
    name: almokhtabar-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: almokhtabar-postgres
          property: connectionString
      - key: REDIS_URL
        value: "redis://default:placeholder@localhost:6379"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "https://web-nu-eight-r5mqqfgrwl.vercel.app,https://elm5tber.vercel.app,https://web-gtfb2fruj-mmmelbahrawy55-beeps-projects.vercel.app"
      - key: FRONTEND_URL
        value: "https://web-nu-eight-r5mqqfgrwl.vercel.app"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: TOTP_ISSUER
        value: "Al Mokhtabar Laboratory"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: MAX_FILE_SIZE
        value: "10485760"

databases:
  - name: almokhtabar-postgres
    plan: free
    databaseName: almokhtabar
