      alertThreshold: "HIGH"
    - id: 90001  # Browser Cache
      alertThreshold: "MEDIUM"
    - id: 90003  # Subresource Integrity
      alertThreshold: "MEDIUM"

passiveScan:
  maxAlertsPerRule: 50
  maxNumberOfScansInUI: 20

report:
  format: ["html", "json", "xml"]
  template: "traditional"
  reportDir: "../reports/security"
  reportName: "zap-scan-{timestamp}"
  displayAlerts: true
  includeConfidence: true
  riskSummary: true
